services:
  event-management-console:
    build:
      context: ../services/event-management-console
      dockerfile: Dockerfile
    image: event-management/event-management-console:1.0.0
    container_name: event-management-console
    restart: unless-stopped
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - event-management-net

networks:
  event-management-net:
    external: true
    name: event-management-net
