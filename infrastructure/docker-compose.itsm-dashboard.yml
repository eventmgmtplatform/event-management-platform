services:
  itsm-ticketing-dashboard:
    build:
      context: ../services/itsm-ticketing-dashboard
      dockerfile: Dockerfile
    container_name: event-itsm-ticketing-dashboard
    restart: unless-stopped
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - event-management-net

