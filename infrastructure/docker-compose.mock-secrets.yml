services:
  mock-secrets:
    build: ../services/mock-secrets
    image: event-management/mock-secrets:0.1.0
    container_name: event-mock-secrets
    restart: unless-stopped
    read_only: true
    volumes:
      - mock-secrets-data:/data
      - mock-secrets-keys:/keys
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [event-management-net]
volumes:
  mock-secrets-data:
  mock-secrets-keys:
