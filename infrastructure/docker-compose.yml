name: event-management

services:
  # ==========================================================
  # SERVICENOW MOCK
  # ==========================================================
  integration-worker:
    build:
      context: ../services/integration-worker
      dockerfile: Dockerfile
    container_name: event-integration-worker
    restart: unless-stopped

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_COMMANDS: integration.commands
      KAFKA_TOPIC_RESULTS: integration.results
      KAFKA_CONSUMER_GROUP_ID: integration-worker
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: 10000
      KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS: 3000

      SERVICENOW_BASE_URL: http://servicenow-mock:8080
      SERVICENOW_CREATE_TICKET_PATH: /api/now/table/incident
      SERVICENOW_LOOKUP_TICKET_PATH: /api/now/table/incident
      SERVICENOW_RECONCILIATION_NOT_FOUND_CONFIRMATIONS: 3
      SERVICENOW_RECONCILIATION_CONFIRMATION_DELAY_MS: 1000
      SERVICENOW_TIMEOUT_MS: 20000
      SERVICENOW_RETRY_MAX_ATTEMPTS: 3
      SERVICENOW_RETRY_INITIAL_DELAY_MS: 1000

      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTEGRATION_IDEMPOTENCY_LEASE_DURATION_MS: 60000

      HTTP_PORT: 8083
      INTEGRATION_READINESS_TIMEOUT_MS: 5000
      INTEGRATION_READINESS_STABILIZATION_MS: 15000

    ports:
      - "8083:8083"

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8083/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      servicenow-mock:
        condition: service_started

    networks:
      - event-management-net
 
  # ==========================================================
  # SERVICENOW MOCK
  # ========================================================== 
  event-state-service:
    build:
      context: ../services/event-state-service
      dockerfile: Dockerfile
    container_name: event-state-service
    hostname: event-state-service

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_INTEGRATION_RESULTS: integration.results
      KAFKA_CONSUMER_GROUP_ID: event-state-service
      KAFKA_AUTO_OFFSET_RESET: earliest

      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      OPENSEARCH_BASE_URL: http://opensearch:9200
      OPENSEARCH_EVENTS_CURRENT_INDEX: events-current
      OPENSEARCH_REQUEST_TIMEOUT_MS: 20000

      QUARKUS_HTTP_PORT: 8084
      QUARKUS_LOG_LEVEL: INFO

    ports:
      - "8084:8084"

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8084/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    networks:
      - event-management-net

    restart: unless-stopped

  # ==========================================================
  # SERVICENOW MOCK
  # ==========================================================
  servicenow-mock:
    image: wiremock/wiremock:3.13.1
    container_name: event-servicenow-mock
    hostname: servicenow-mock
    restart: unless-stopped

    command:
      - "--port"
      - "8080"
      - "--verbose"

    ports:
      - "8181:8080"

    volumes:
      - ./mock-integrations/servicenow:/home/wiremock:ro

    networks:
      - event-management-net

  # ==========================================================
  # APACHE KAFKA - SINGLE NODE KRAFT
  # ==========================================================
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: event-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      # ------------------------------------------------------
      # KRaft identity
      # ------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # ------------------------------------------------------
      # Listeners
      #
      # PLAINTEXT:
      #   comunicación interna entre contenedores
      #
      # PLAINTEXT_HOST:
      #   comunicación desde Ubuntu/localhost
      #
      # CONTROLLER:
      #   comunicación interna KRaft
      # ------------------------------------------------------
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ------------------------------------------------------
      # Single-node replication settings
      # ------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # ------------------------------------------------------
      # Development settings
      # ------------------------------------------------------
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    networks:
      - event-management-net


  # ==========================================================
  # KAFKA TOPIC INITIALIZER
  # ==========================================================
  kafka-init:
    image: ${KAFKA_IMAGE}
    container_name: event-kafka-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./kafka/create-topics.sh:/opt/event-management/create-topics.sh:ro

    entrypoint:
      - /bin/bash
      - /opt/event-management/create-topics.sh

    networks:
      - event-management-net


  # ==========================================================
  # EVENT GATEWAY
  # ==========================================================
  event-gateway:
    build:
      context: ../services/event-gateway
      dockerfile: Dockerfile

    image: event-management/event-gateway:1.0.0
    container_name: event-gateway
    hostname: event-gateway
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8081:8081"

    environment:
      EVENT_GATEWAY_KAFKA_BROKERS: kafka:29092
      EVENT_GATEWAY_KAFKA_TOPIC: events.raw

      EVENT_GATEWAY_AUTH_ENABLED: "false"
      EVENT_GATEWAY_API_KEY: local-lab-key
      EVENT_GATEWAY_DEFAULT_TENANT: default
      EVENT_GATEWAY_DEFAULT_SOURCE: zabbix

      JAVA_OPTS: >-
        -Xms128m
        -Xmx512m
        -XX:+UseG1GC
        -Djava.net.preferIPv4Stack=true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/api/v1/gateway >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - event-management-net


  # ==========================================================
  # ENRICHMENT ENGINE - HELLO WORLD FOUNDATION
  # ==========================================================
  enrichment-engine:
    build:
      context: ../services/enrichment-engine
      dockerfile: Dockerfile

    image: event-management/enrichment-engine:1.0.0
    container_name: event-enrichment-engine
    hostname: enrichment-engine
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8082:8082"

    environment:
      QUARKUS_HTTP_PORT: 8082
      ENRICHMENT_KAFKA_BROKERS: kafka:29092
      ENRICHMENT_KAFKA_INPUT_TOPIC: events.raw
      ENRICHMENT_KAFKA_OUTPUT_TOPIC: events.normalized
      ENRICHMENT_KAFKA_CONSUMER_GROUP: enrichment-engine
      ENRICHMENT_KAFKA_AUTO_OFFSET_RESET: latest
      JAVA_OPTS: >-
        -Xms128m
        -Xmx512m
        -XX:+UseG1GC
        -Djava.net.preferIPv4Stack=true

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/v1/enrichment >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - event-management-net

  # ==========================================================
  # KAFBAT UI - KAFKA WEB CONSOLE
  # ==========================================================
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    container_name: event-kafka-ui
    hostname: kafka-ui
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: event-management-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

      DYNAMIC_CONFIG_ENABLED: "true"
      SWAGGER_UI_ENABLED: "true"

      AUTH_TYPE: DISABLED
      MANAGEMENT_HEALTH_LDAP_ENABLED: "false"

    networks:
      - event-management-net


  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: event-postgres
    hostname: postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - event-management-net


  # ==========================================================
  # OPENSEARCH - SINGLE NODE LOCAL LAB
  # ==========================================================
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: event-opensearch
    hostname: opensearch
    restart: unless-stopped

    ports:
      - "9200:9200"
      - "9600:9600"

    environment:
      cluster.name: event-management-cluster
      node.name: event-opensearch-node
      discovery.type: single-node

      bootstrap.memory_lock: "true"

      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}

      # Solo para laboratorio local
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"

    ulimits:
      memlock:
        soft: -1
        hard: -1

      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail http://localhost:9200/_cluster/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 45s

    networks:
      - event-management-net


  # ==========================================================
  # OPENSEARCH DASHBOARDS
  # ==========================================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    container_name: event-opensearch-dashboards
    hostname: opensearch-dashboards
    restart: unless-stopped

    depends_on:
      opensearch:
        condition: service_healthy

    ports:
      - "5601:5601"

    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'

      # Solo para laboratorio local
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

      SERVER_HOST: 0.0.0.0

    networks:
      - event-management-net


# ============================================================
# VOLUMES
# ============================================================
volumes:
  kafka-data:
    name: event-management-kafka-data

  postgres-data:
    name: event-management-postgres-data

  opensearch-data:
    name: event-management-opensearch-data


# ============================================================
# NETWORK
# ============================================================
networks:
  event-management-net:
    name: event-management-net
    driver: bridge
