quarkus.application.name=enrichment-engine
quarkus.http.host=0.0.0.0
quarkus.http.port=8082

camel.main.startup-summary-level=verbose

quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."com.eventmanagement.enrichment".level=INFO

enrichment.kafka.brokers=localhost:9092
enrichment.kafka.input-topic=events.raw
enrichment.kafka.output-topic=events.normalized
enrichment.kafka.consumer-group=enrichment-engine
enrichment.kafka.auto-offset-reset=earliest

camel.component.kafka.brokers=${enrichment.kafka.brokers}
