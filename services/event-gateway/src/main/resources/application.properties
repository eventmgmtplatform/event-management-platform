quarkus.application.name=event-gateway
quarkus.http.host=0.0.0.0
quarkus.http.port=8081

camel.main.startup-summary-level=verbose

quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."com.eventmanagement.gateway".level=INFO

# Apache Kafka
event.gateway.kafka.brokers=localhost:9092
event.gateway.kafka.topic=events.raw

# Productor Kafka
camel.component.kafka.brokers=${event.gateway.kafka.brokers}

# Original receipt must commit before validation or Kafka publication.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${GATEWAY_POSTGRES_USER:gateway_collection}
quarkus.datasource.password=${GATEWAY_POSTGRES_PASSWORD:}
quarkus.datasource.jdbc.url=${GATEWAY_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/eventmanagement}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.devservices.enabled=false
quarkus.http.limits.max-body-size=1M

# Apply migration 026 before enabling rules. Administration is closed without a key.
event.gateway.rules.enabled=${GATEWAY_RULES_ENABLED:false}
event.gateway.rules.admin-key=${GATEWAY_RULES_ADMIN_KEY:}
