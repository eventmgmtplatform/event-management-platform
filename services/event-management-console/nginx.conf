server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP","component":"event-management-console","version":"1.0.0","mode":"INTERNAL_API"}';
  }

  location = /api/administration/platform {
    resolver 127.0.0.11 valid=10s;
    set $inventory_backend http://frontend-management-api:8093;
    proxy_pass $inventory_backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store";
  }

  location /api/administration/operations {
    resolver 127.0.0.11 valid=10s;
    set $control_backend http://frontend-management-api:8093;
    proxy_pass $control_backend;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    client_max_body_size 1k;
    limit_except GET POST { deny all; }
  }

  location = /api/administration/middleware {
    resolver 127.0.0.11 valid=10s;
    set $middleware_backend http://frontend-management-api:8093;
    proxy_pass $middleware_backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    limit_except GET { deny all; }
  }

  location = /api/administration/sources {
    resolver 127.0.0.11 valid=10s;
    set $sources_backend http://frontend-management-api:8093;
    proxy_pass $sources_backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Fixed isolated mock only. No route to the ServiceNow mock used by tests.
  location /api/now/table/incident {
    resolver 127.0.0.11 valid=10s;
    set $snow_backend http://servicenow-console-mock:8080;
    proxy_pass $snow_backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    client_max_body_size 16k;
    limit_except GET PATCH { deny all; }
  }

  location /api/ess/ {
    resolver 127.0.0.11 valid=10s;
    set $ess_backend http://console-catalog-api:8094;
    proxy_pass $ess_backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    # Suppress query logs and prevent browser credentials entering the boundary.
    access_log off;
    add_header Cache-Control "no-store" always;
    if ($request_method != GET) { return 405; }
  }

  location /api/catalog/ {
    resolver 127.0.0.11 valid=10s;
    set $catalog_backend http://console-catalog-api:8094;
    proxy_pass $catalog_backend;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
    limit_except GET POST PUT DELETE { deny all; }
  }

  # Blackout administration only; query strings and conditional headers pass unchanged.
  location ~ "^/api/processor/v1/(rules(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,127}(?:/(?:history|enable|disable|retire))?)?|simulations)$" {
    resolver 127.0.0.11 valid=10s;
    set $processor_backend http://event-processor:8082;
    rewrite ^/api/processor/v1/(.*)$ /api/v1/$1 break;
    proxy_pass $processor_backend;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header If-Match $http_if_match;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 256k;
    limit_except GET POST { deny all; }
    add_header Cache-Control "no-store" always;
  }

  location /api/ { return 404; }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
