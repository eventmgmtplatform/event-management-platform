quarkus.application.name=event-processor
quarkus.http.host=0.0.0.0
quarkus.http.port=8082
quarkus.smallrye-health.root-path=/health
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=5S
processor.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
processor.kafka.input-topic=events.raw
processor.kafka.output-topic=events.normalized
processor.kafka.dlq-topic=events.dlq
# Deliberately retain the predecessor group; migration must NOT replay all retained events.
processor.kafka.consumer-group=enrichment-engine
processor.kafka.auto-offset-reset=latest
processor.outbox.batch-size=10
processor.outbox.poll-ms=1000
# Local operational defaults; not production SLOs. Retries remain unlimited and durable.
processor.outbox.retry-initial-ms=1000
processor.outbox.retry-max-ms=30000
quarkus.log.level=INFO
quarkus.log.category."org.apache.kafka".level=WARN

# Local administration deliberately has no authentication (deferred in defect prevention).
processor.admin.enabled=${PROCESSOR_ADMIN_ENABLED:true}
quarkus.http.limits.max-body-size=256K
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%m %s
processor.kafka.enabled=true
%test.quarkus.kafka.devservices.enabled=false
