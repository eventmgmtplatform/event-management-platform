# ============================================================
# APPLICATION
# ============================================================

quarkus.application.name=event-state-service
quarkus.http.host=0.0.0.0
quarkus.http.port=8084

# ============================================================
# CAMEL
# ============================================================

camel.main.name=event-state-service-camel-context
camel.main.routes-include-pattern=classpath:routes/*.xml

# ============================================================
# KAFKA
# ============================================================

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka.topic.integration.results=${KAFKA_TOPIC_INTEGRATION_RESULTS:integration.results}

kafka.consumer.group.id=${KAFKA_CONSUMER_GROUP_ID:event-state-service}
kafka.consumer.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# ============================================================
# POSTGRESQL
# ============================================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:eventmanager}
quarkus.datasource.password=${POSTGRES_PASSWORD}

quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/eventmanagement}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=20S

# ============================================================
# OPENSEARCH
# ============================================================

opensearch.base-url=${OPENSEARCH_BASE_URL:http://localhost:9200}
opensearch.index.events-current=${OPENSEARCH_EVENTS_CURRENT_INDEX:events-current}
opensearch.request-timeout-ms=${OPENSEARCH_REQUEST_TIMEOUT_MS:20000}

# ============================================================
# LOGGING
# ============================================================

quarkus.log.level=INFO
quarkus.log.category."com.eventmanagement".level=DEBUG
quarkus.log.category."org.apache.kafka".level=WARN

# ============================================================
# HEALTH
# ============================================================

quarkus.smallrye-health.root-path=/health

kafka.topic.state.requested=${KAFKA_TOPIC_STATE_REQUESTED:events.state.requested}

ess.admin.credentials-file=${ESS_ADMIN_CREDENTIALS_FILE:}
