# ============================================================
# APPLICATION
# ============================================================

quarkus.application.name=integration-worker
quarkus.http.host=0.0.0.0
quarkus.http.port=8083

# ============================================================
# CAMEL
# ============================================================

camel.main.name=integration-worker-camel-context
camel.main.routes-include-pattern=classpath:routes/*.xml

# ============================================================
# KAFKA
# ============================================================

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka.topic.integration.commands=${KAFKA_TOPIC_INTEGRATION_COMMANDS:integration.commands}
kafka.topic.integration.results=${KAFKA_TOPIC_INTEGRATION_RESULTS:integration.results}
kafka.topic.events.dlq=${KAFKA_TOPIC_EVENTS_DLQ:events.dlq}

kafka.consumer.group.id=${KAFKA_CONSUMER_GROUP_ID:integration-worker}
kafka.consumer.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
kafka.consumer.session-timeout-ms=${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:10000}
kafka.consumer.heartbeat-interval-ms=${KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:3000}

# ============================================================
# SERVICENOW
# ============================================================

integration.servicenow.base-url=${SERVICENOW_BASE_URL:http://localhost:8181}
integration.servicenow.create-ticket-path=${SERVICENOW_CREATE_TICKET_PATH:/api/now/table/incident}
integration.servicenow.timeout-ms=${SERVICENOW_TIMEOUT_MS:20000}
integration.servicenow.retry.max-attempts=${SERVICENOW_RETRY_MAX_ATTEMPTS:3}
integration.servicenow.retry.initial-delay-ms=${SERVICENOW_RETRY_INITIAL_DELAY_MS:1000}

# ServiceNowRetryExecutor is the only retry authority. Disable retries in the
# shared Camel HTTP client so one logical attempt equals one physical request.
camel.component.http.automatic-retries-disabled=true

# Durable ServiceNow command idempotency
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:eventmanager}
quarkus.datasource.password=${POSTGRES_PASSWORD:EventManagementLab2026}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/eventmanagement}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=20S

integration.readiness.timeout-ms=${INTEGRATION_READINESS_TIMEOUT_MS:5000}
integration.readiness.stabilization-ms=${INTEGRATION_READINESS_STABILIZATION_MS:15000}

# ============================================================
# LOGGING
# ============================================================

quarkus.log.level=INFO
quarkus.log.category."com.eventmanagement".level=DEBUG
quarkus.log.category."org.apache.kafka".level=WARN

# ============================================================
# HEALTH
# ============================================================

quarkus.smallrye-health.root-path=/health
