# ============================================================
# APPLICATION
# ============================================================

quarkus.application.name=integration-worker
quarkus.http.host=0.0.0.0
quarkus.http.port=8083

# ============================================================
# CAMEL
# ============================================================

camel.main.name=integration-worker-camel-context
camel.main.routes-include-pattern=classpath:routes/*.xml

# ============================================================
# KAFKA
# ============================================================

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka.topic.integration.commands=${KAFKA_TOPIC_INTEGRATION_COMMANDS:integration.commands}
kafka.topic.integration.results=${KAFKA_TOPIC_INTEGRATION_RESULTS:integration.results}
kafka.topic.events.dlq=${KAFKA_TOPIC_EVENTS_DLQ:events.dlq}

kafka.consumer.group.id=${KAFKA_CONSUMER_GROUP_ID:integration-worker}
kafka.consumer.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# ============================================================
# SERVICENOW
# ============================================================

integration.servicenow.base-url=${SERVICENOW_BASE_URL:http://localhost:8181}
integration.servicenow.create-ticket-path=${SERVICENOW_CREATE_TICKET_PATH:/api/now/table/incident}
integration.servicenow.timeout-ms=${SERVICENOW_TIMEOUT_MS:20000}

integration.readiness.timeout-ms=${INTEGRATION_READINESS_TIMEOUT_MS:5000}

# ============================================================
# LOGGING
# ============================================================

quarkus.log.level=INFO
quarkus.log.category."com.eventmanagement".level=DEBUG
quarkus.log.category."org.apache.kafka".level=WARN

# ============================================================
# HEALTH
# ============================================================

quarkus.smallrye-health.root-path=/health
