server {
    listen 8080;
    server_name _;
    # Preserve the browser's hostname and published port in redirects.
    absolute_redirect off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "UP\n";
    }

    location /itsm/tickets/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /itsm/tickets/index.html;
    }

    location = / {
        return 302 /itsm/tickets/;
    }
}
