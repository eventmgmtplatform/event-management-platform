server {
  listen 8091;
  server_name _;
  root /usr/share/nginx/dashboards;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /health { default_type application/json; return 200 '{"status":"UP","component":"oem-dashboards","version":"0.1.0"}'; }
  location /api/dashboards/ {
    resolver 127.0.0.11 valid=10s;
    set $dashboards_backend http://oem-dashboards-api:8092;
    proxy_pass $dashboards_backend;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_hide_header Server;
    add_header Cache-Control no-store always;
  }
  location /api/administration/ {
    resolver 127.0.0.11 valid=10s;
    set $management_backend http://frontend-management-api:8093;
    proxy_pass $management_backend;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control no-store always;
  }
  location /api/ { default_type application/json; return 404 '{"error":"Unknown API"}'; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-store; }
}
