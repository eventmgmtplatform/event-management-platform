name: cacf-certification
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cacf_test
      POSTGRES_USER: cacf_test
      POSTGRES_PASSWORD: cacf-test-only
    ports: ["127.0.0.1:15439:5432"]
    volumes:
      - cacf-test-postgres:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacf_test -d cacf_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  next-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:18183:8080"]
    volumes: ["../mocks/next:/home/wiremock:ro"]
  servicenow-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:18184:8080"]
    volumes: ["../mocks/cacf-servicenow:/home/wiremock:ro"]
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    volumes: ["../../infrastructure/kafka/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["bash", "/create-topics.sh"]
  integration-worker:
    build: ../../services/integration-worker
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      next-mock: {condition: service_started}
      servicenow-mock: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/cacf_test
      POSTGRES_USER: cacf_test
      POSTGRES_PASSWORD: cacf-test-only
      SERVICENOW_BASE_URL: http://servicenow-mock:8080
      CACF_ENABLED: "true"
      NEXT_BASE_URL: http://next-mock:8080
      NEXT_USERNAME: cacf-local-test
      NEXT_PASSWORD: cacf-local-test
      CACF_API_TOKEN: cacf-local-test
      INTEGRATION_READINESS_STABILIZATION_MS: 1000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health/ready >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  cacf-test-postgres:
