# Isolated OS_11 laboratory. Build local quarkus-app directories before starting.
name: os11-lifecycle
x-java: &java
  image: event-management/event-processor:1.0.0
  entrypoint: ["java", "-jar", "/deployments/quarkus-run.jar"]
x-environment: &environment
  POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/lifecycle
  POSTGRES_USER: lifecycle
  POSTGRES_PASSWORD: synthetic-lifecycle-only
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lifecycle
      POSTGRES_USER: lifecycle
      POSTGRES_PASSWORD: synthetic-lifecycle-only
    volumes:
      - lifecycle-postgres:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecycle -d lifecycle"]
      interval: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["lifecycle-kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    volumes: ["../../infrastructure/kafka/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["bash", "/create-topics.sh"]
  opensearch:
    ports: ["127.0.0.1:28092:9200"]
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["lifecycle-search:/usr/share/opensearch/data"]
  servicenow-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:28181:8080"]
  gnm-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:28182:8080"]
  next-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:28183:8080"]
  gateway:
    <<: *java
    ports: ["127.0.0.1:28081:8081"]
    volumes: ["../../services/event-gateway/target/quarkus-app:/deployments:ro"]
    environment:
      EVENT_GATEWAY_KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  processor:
    <<: *java
    ports: ["127.0.0.1:28082:8082"]
    volumes: ["../../services/event-processor/target/quarkus-app:/deployments:ro"]
    environment:
      <<: *environment
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  worker:
    <<: *java
    ports: ["127.0.0.1:28083:8083"]
    volumes:
      - ../../services/integration-worker/target/quarkus-app:/deployments:ro
      - ../fixtures/lifecycle/gnm-registry.json:/gnm-registry.json:ro
    environment:
      <<: *environment
      GNM_PROVIDER_REGISTRY_RESOURCE: file:/gnm-registry.json
      SERVICENOW_BASE_URL: http://servicenow-mock:8080
      GNM_BASE_URL: http://gnm-mock:8080
      CACF_ENABLED: "true"
      NEXT_BASE_URL: http://next-mock:8080
      NEXT_USERNAME: synthetic
      NEXT_PASSWORD: synthetic
      CACF_API_TOKEN: synthetic-lifecycle-only
      INTEGRATION_READINESS_STABILIZATION_MS: 1000
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  ess:
    <<: *java
    ports: ["127.0.0.1:28084:8084"]
    volumes: ["../../services/event-state-service/target/quarkus-app:/deployments:ro"]
    environment:
      <<: *environment
      OPENSEARCH_BASE_URL: http://opensearch:9200
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
volumes:
  lifecycle-postgres:
  lifecycle-kafka:
  lifecycle-search:
