openapi: 3.0.3
info:
  title: Event Management Platform API
  version: 0.1.0
  description: >-
    Contrato de referencia para el proxy same-origin de la consola y la
    administración del Event Processor. Los mocks locales no representan
    proveedores productivos.
servers:
  - url: http://localhost:8090/api
    description: Consola local mediante proxy same-origin
tags:
  - name: Catalog
  - name: Processor rules
  - name: Blackouts
  - name: AIOps
  - name: State
  - name: Dashboards
  - name: Secrets
paths:
  /catalog/views/{view}:
    get:
      tags: [Catalog]
      summary: Read a catalog view
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Catalog rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processor/v1/rules:
    get:
      tags: [Processor rules]
      summary: List rule versions
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/After'}]
      responses:
        '200': {description: Rule list}
    post:
      tags: [Processor rules]
      summary: Create a rule version
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Rule'}}}}
      responses: {'201': {description: Created}, '409': {$ref: '#/components/responses/Conflict'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
  /processor/v1/rules/{id}:
    get:
      tags: [Processor rules]
      summary: Read a rule
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Tenant'}, {name: version, in: query, schema: {type: integer}}]
      responses: {'200': {description: Rule}, '404': {$ref: '#/components/responses/NotFound'}}
  /processor/v1/rules/validate:
    post:
      tags: [Processor rules]
      summary: Validate a rule without publishing
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Rule'}}}}
      responses: {'200': {description: Validation result}, '400': {$ref: '#/components/responses/BadRequest'}}
  /processor/v1/rules/{id}/{action}:
    post:
      tags: [Processor rules]
      summary: Enable, disable, or retire a rule
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [enable, disable, retire]}
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: {'200': {description: Updated rule}, '409': {$ref: '#/components/responses/Conflict'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
  /processor/v1/simulations:
    post:
      tags: [Processor rules]
      summary: Simulate processing without side effects
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'200': {description: Simulation result}}
  /processor/v1/blackouts:
    get:
      tags: [Blackouts]
      summary: List blackouts
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/After'}]
      responses: {'200': {description: Blackout list}}
    post:
      tags: [Blackouts]
      summary: Create a blackout
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Blackout'}}}}
      responses: {'201': {description: Created}, '409': {$ref: '#/components/responses/Conflict'}}
  /processor/v1/aiops:
    get:
      tags: [AIOps]
      summary: List AIOps configurations
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/After'}]
      responses: {'200': {description: Configuration array}}
    post:
      tags: [AIOps]
      summary: Create an AIOps configuration
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiopsConfiguration'}}}}
      responses: {'201': {description: Created}, '409': {$ref: '#/components/responses/Conflict'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
  /processor/v1/aiops/{id}:
    get:
      tags: [AIOps]
      summary: Read an AIOps configuration
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Tenant'}]
      responses: {'200': {description: Configuration}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [AIOps]
      summary: Update an AIOps configuration
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, enabled], properties: {name: {type: string, maxLength: 128}, enabled: {type: boolean}}}}}}
      responses: {'200': {description: Updated}, '409': {$ref: '#/components/responses/Conflict'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
    delete:
      tags: [AIOps]
      summary: Logically delete an AIOps configuration
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Conflict'}}
  /processor/v1/aiops/{id}/assessments:
    post:
      tags: [AIOps]
      summary: Assess a signal with the internal mock provider
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Tenant'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentRequest'}}}}
      responses: {'200': {description: Synthetic assessment}, '409': {$ref: '#/components/responses/Conflict'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /mock-secrets:
    get:
      tags: [Secrets]
      summary: List secret references from local MockSecrets
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      responses: {'200': {description: Secret references}}
    post:
      tags: [Secrets]
      summary: Store a secret in local MockSecrets
      parameters: [{$ref: '#/components/parameters/Tenant'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretInput'}}}}
      responses: {'201': {description: Stored reference}}
  /dashboards/{domain}:
    get:
      tags: [Dashboards]
      summary: Read a dashboard domain
      parameters: [{name: domain, in: path, required: true, schema: {type: string, enum: [events, ticketing, gnm, cacf, delivery, data-collection]}}]
      responses: {'200': {description: Dashboard data}, '503': {$ref: '#/components/responses/Unavailable'}}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    View: {name: view, in: path, required: true, schema: {type: string}}
    Tenant: {name: X-Tenant-Id, in: header, required: true, schema: {type: string, minLength: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    After: {name: after, in: query, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string}}
  responses:
    BadRequest: {description: Invalid request}
    Conflict: {description: Revision conflict or duplicate identifier}
    NotFound: {description: Resource not found}
    PreconditionRequired: {description: Missing If-Match}
    Unavailable: {description: Dependency unavailable}
  schemas:
    CatalogResponse:
      type: object
      required: [items, truncated, mode]
      properties:
        items: {type: array, items: {type: object}}
        truncated: {type: boolean}
        mode: {type: string}
    Rule:
      type: object
      additionalProperties: true
      required: [id]
      properties: {id: {type: string}, enabled: {type: boolean}}
    Blackout:
      type: object
      additionalProperties: true
      required: [id, mode]
      properties: {id: {type: string}, mode: {type: string, enum: [IMMEDIATE, SCHEDULED, RECURRENT]}, enabled: {type: boolean}}
    AiopsConfiguration:
      type: object
      required: [id, name, enabled]
      properties:
        id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
    AssessmentRequest:
      type: object
      required: [resource, summary, severity]
      properties:
        resource: {type: string, minLength: 1, maxLength: 256}
        summary: {type: string, minLength: 1, maxLength: 1024}
        severity: {type: integer, minimum: 0, maximum: 5}
    SecretInput:
      type: object
      required: [tenant, environment, name, kind, value]
      properties:
        tenant: {type: string}
        environment: {type: string}
        name: {type: string}
        kind: {type: string}
        value: {type: string, writeOnly: true}
